<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Controle - Festa</title>
  
  <!-- Fontes Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
    body { background-color: #f4f7f6; color: #333; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }

    /* Tela de Login */
    #login-box {
      max-width: 400px;
      margin: 80px auto;
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: center;
    }
    #login-box input {
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }
    #login-box input:focus { border-color: #ff65a3; }
    #login-box button {
      width: 100%;
      padding: 12px;
      background: #ff65a3;
      color: #fff;
      font-weight: 800;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }
    #login-box button:hover { background: #e55390; }

    /* Painel ADM */
    #admin-content { display: none; }
    .header-adm {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .header-adm h1 { font-weight: 900; color: #222; font-size: 1.8rem; }
    .btn-refresh {
      background: #ff9d00;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-refresh:hover { opacity: 0.9; }

    /* Cards de Estatísticas */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: #fff;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      border-top: 5px solid #ff65a3;
      text-align: center;
    }
    .stat-card h3 { font-size: 0.85rem; color: #666; text-transform: uppercase; margin-bottom: 5px; }
    .stat-card p { font-size: 2rem; font-weight: 900; color: #222; }

    /* Tabela de Convidados */
    .table-responsive {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 14px 18px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
    th { background: #ff8ca3; color: #fff; font-weight: 800; text-transform: uppercase; font-size: 0.8rem; }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.75rem;
    }
    .badge-sim { background: #d1ecc5; color: #2e7d32; }
    .badge-nao { background: #ffd6dc; color: #c2185b; }
  </style>
</head>
<body>

  <div class="container">

    <!-- Tela de Senha -->
    <div id="login-box">
      <h2>Painel da Anfitriã 🎂</h2>
      <p style="font-size: 0.85rem; color: #666; margin-top: 5px;">Digite a senha de acesso:</p>
      <input type="password" id="senhaAdmin" placeholder="Sua senha" onkeydown="if(event.key==='Enter') autenticar()">
      <button onclick="autenticar()">Entrar</button>
    </div>

    <!-- Painel de Dados -->
    <div id="admin-content">
      <div class="header-adm">
        <h1>Lista de Confirmados</h1>
        <button class="btn-refresh" onclick="carregarDados()">🔄 Atualizar Dados</button>
      </div>

      <!-- Resumo Total -->
      <div class="stats-grid">
        <div class="stat-card" style="border-top-color: #4CAF50;">
          <h3>Total Confirmados</h3>
          <p id="total-confirmados">0</p>
        </div>
        <div class="stat-card" style="border-top-color: #ff9d00;">
          <h3>Adultos</h3>
          <p id="total-adultos">0</p>
        </div>
        <div class="stat-card" style="border-top-color: #2196F3;">
          <h3>Crianças (&le; 11 anos)</h3>
          <p id="total-c11">0</p>
        </div>
        <div class="stat-card" style="border-top-color: #F44336;">
          <h3>Não Vão</h3>
          <p id="total-nao">0</p>
        </div>
      </div>

      <!-- Tabela -->
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Status</th>
              <th>Adultos</th>
              <th>Crianças até 11 anos</th>
              <th>Data/Hora</th>
            </tr>
          </thead>
          <tbody id="tabela-corpo">
            <tr><td colspan="5" style="text-align:center;">Carregando respostas...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Script Externo -->
  <script src="./script/admin.js"></script>
</body>
</html>
