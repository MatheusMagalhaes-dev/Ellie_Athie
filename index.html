<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convite Especial - Meninas Superpoderosas</title>
  
  <!-- Fontes Google -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lavishly+Yours&family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/style.css">

</head>
<body>

  <!-- Seção 1: Foto Principal -->
  <section class="hero-section">
    <div class="frame-wrapper">
        <img class="elliesup" src="./src/images/elliepng.png" >
    </div>
  </section>

  <!-- Seção 2: Confirmação de Presença -->
  <section class="rsvp-section">
    <div class="content-wrapper">
      <div class="rsvp-container">
        <!-- Elemento Decorativo: Florzinha -->
        <img class="character-florzinha" src="./src/images/florzinharemove.png" alt="Florzinha">
        
        <h2 class="rsvp-title">Confirme Sua Presença</h2>
        
        <div class="btn-group">
          <a href="./confirmar.html" class="btn">Confirmar</a>
        </div>

        <div class="info-card">
          <div class="info-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            <span>Quintal: R. Ver. Rodolfo Arthur Salvetti, 285 - Jardim Carambeí, São Roque - SP, 18132-305</span>
          </div>
          <div class="info-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            <span>06/09/2026</span>
          </div>
        </div>
      </div>
    </div>
  </section>
  <section class="map-section">
    <div class="content-wrapper">
      <h3 class="map-title">Como Chegar</h3>
      <div class="map-container">
        <iframe 
          src="https://maps.google.com/maps?q=R.+Ver.+Rodolfo+Arthur+Salvetti,+285+-+Jardim+Carambe%C3%AD,+S%C3%A3o+Roque+-+SP,+18132-305&t=&z=16&ie=UTF8&iwloc=&output=embed" 
          allowfullscreen="" 
          loading="lazy" 
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>
      <a href="https://maps.google.com/?q=R.+Ver.+Rodolfo+Arthur+Salvetti,+285+-+Jardim+Carambe%C3%AD,+S%C3%A3o+Roque+-+SP,+18132-305" target="_blank" rel="noopener noreferrer" class="btn-maps">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        Abrir no Google Maps
      </a>
    </div>
  </section>

  <!-- Seção 3: Sessão de Presentes -->
  <section class="gifts-section">
    <div class="content-wrapper">
      <h2 class="gifts-title">Sessão de Presentes</h2>


      <p class="gifts-disclaimer">
        Brinquedos meramente ilustrativos<br>
        clique no link para a lista oficial!
      </p>
    </div>
  </section>

  <!-- Rodapé Full Width -->
  <footer class="footer-banner">
    <img src="https://via.placeholder.com/1920x350.png?text=Banner+Vilões+e+Heroínas" alt="Meninas Superpoderosas Rodapé">
  </footer>

</body>
</html>
