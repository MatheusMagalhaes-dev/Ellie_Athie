<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Confirmação de Presença - Meninas Superpoderosas</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./styles/confirmar.css">
</head>
<body class="form-page-body">

  <div class="form-wrapper">

    <div class="form-card">
      <h1 class="form-title">Confirmação de Presença</h1>
      <p class="form-subtitle">Preencha os dados abaixo para confirmar sua participação!</p>

      <form id="rsvpForm">
        
        <div class="row">
          <div class="form-group">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" required placeholder="Seu nome">
          </div>
          <div class="form-group">
            <label for="sobrenome">Sobrenome:</label>
            <input type="text" id="sobrenome" required placeholder="Seu sobrenome">
          </div>
        </div>

        <div class="form-group">
          <label>Você Vai?</label>
          <div class="attendance-selector">
            
            <div class="radio-card">
              <input type="radio" id="vai_sim" name="vai" value="Sim" required>
              <label for="vai_sim" class="radio-label">Sim</label>
            </div>

            <div class="radio-card">
              <input type="radio" id="vai_nao" name="vai" value="Não" required>
              <label for="vai_nao" class="radio-label">Não</label>
            </div>

          </div>
        </div>

        <div id="secao-sim">
          <div class="counter-item">
            <label for="adultos">Adultos e Adolescentes:</label>
            <select id="adultos">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6+">6+</option>
            </select>
          </div>

          <div class="counter-item">
            <label for="criancas_ate_11">Crianças até 11 anos:</label>
            <select id="criancas_ate_11">
              <option value="0">0</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5+">5+</option>
            </select>
          </div>
        </div>

        <div id="secao-nao">
          <h4>Obrigado pela confirmação!! ❤️</h4>
          <p>Sentiremos muito a sua falta nessa celebração superpoderosa!</p>
        </div>

        <button type="submit" class="btn-submit">Confirmar Resposta</button>

        <a href="index.html" class="back-link">← Voltar para o convite</a>
      </form>
    </div>

  </div>

  <!-- Chamada do arquivo JS externo -->
  <script src="./script/confirmar.js"></script>
  <!-- Modal de Confirmação -->
<div id="custom-alert" class="modal-overlay" style="display: none;">
  <div class="modal-box">
    <!-- Adicionamos IDs aqui nestas duas linhas -->
    <h3 id="modal-title-text" class="modal-title">Missão Cumprida! 🦸‍♀️</h3>
    <p id="modal-desc-text" class="modal-text">Sua presença foi confirmada!</p>
    
    <button id="fechar-modal-btn" class="btn-fechar">FECHAR</button>
  </div>
</div>
</body>
</html>
